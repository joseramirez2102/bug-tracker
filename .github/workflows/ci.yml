name: CI

on:
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:


jobs:
  unit-test-backend:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.test-backend.outputs.report }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"
          cache-dependency-path: bugtracker-backend/go.sum

      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report/v2@latest

      - name: Execute backend unit tests
        id: test-backend
        working-directory: ./bugtracker-backend
        run: |
          go test -json -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out > coverage.txt

          echo '## Backend Test Coverage Report' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat coverage.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          go test -v ./... 2>&1 | go-junit-report > test-results.xml

      - name: Publish Backend Unit Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Unit Tests Report
          path: bugtracker-backend/test-results.xml
          reporter: jest-junit


  unit-test-frontend:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.test-frontend.outputs.report }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bugtracker-frontend/package-lock.json

      - name: Execute frontend unit tests
        id: test-frontend
        working-directory: ./bugtracker-frontend
        run: |
          npm ci
          npm test | tee full_output.txt

          echo '## Frontend Test Coverage Report' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat full_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat full_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend Unit Tests
          path: bugtracker-frontend/test-results.xml
          reporter: jest-junit

  create-coverage-comment:
    if: github.event_name == 'pull_request'
    needs: [unit-test-backend, unit-test-frontend]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create Backend Coverage Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Backend Test Coverage Report
            ```
            ${{ needs.unit-test-backend.outputs.coverage }}
            ```

      - name: Create Frontend Coverage Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Frontend Test Coverage Report
            ```
            ${{ needs.unit-test-frontend.outputs.coverage }}
            ```



  api-e2e-perf-tests:
    runs-on: ubuntu-latest
    needs: [unit-test-backend, unit-test-frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Launch application
        run: |
          docker compose up --build -d
          npx wait-port http://localhost:8080/api/health -t 30000

      - name: Run API tests
        working-directory: ./tests-api
        run: |
          npm ci
          npx playwright test

      - name: Run E2E Tests
        working-directory: ./tests-e2e
        env:
          CI: "1"
        run: |
          npm ci
          npx playwright install
          npx playwright test

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run Performance Tests
        uses: grafana/run-k6-action@v1
        with:
          path: tests-perf/script.js
          flags: --out json=summary.json

      - name: Shut Down Application
        run: docker compose down

      - name: Upload API Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-tests-results
          path: ./tests-api/test-results/
          retention-days: 30

      - name: Upload API Test Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-tests-playwright-report
          path: ./tests-api/playwright-report/
          retention-days: 30

      - name: Upload E2E Test Results Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-tests-results
          path: ./tests-e2e/test-results/
          retention-days: 30

      - name: Upload E2E Test Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-tests-playwright-report
          path: ./tests-e2e/playwright-report/
          retention-days: 30

      - name: Publish API Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: API Tests Report
          path: ./tests-api/test-results/*.xml
          reporter: jest-junit

      - name: Publish E2E Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Tests Report
          path: ./tests-e2e/test-results/results.xml
          reporter: jest-junit